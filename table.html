<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>student details</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <style>
        table{
            border-collapse:separate;/*collapse*/
            width:700px;
            border-spacing:5px;
            border:2px solid black;

        }
        th,
        td{
            border:2px solid black;
            padding:20px;
            text-align:center;
            vertical-align:middle;
        }
        th{
            background-color:lightblue
        }
        .row3 {
            height: 20px;
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <h2> details</h2>
    <table>
    <tr>
        <th>column 1</th>
        <th>column 2</th>
        <th>column 3</th>
    </tr>
    <tr>
        <td rowspan="2">Row1 cell 1</td>
        <td>Row1 cell 2</td>
        <td>Row 1 cell 3</td>
    </tr>
    <tr>
        <td>Row 2 cell 2</td>
        <td>Row 2 cell 3</td>
    </tr>
    <tr>
        <td columnspan="3" class="row3">Row 3 cell 1</td>
    </tr>
    </table>
</body>
</html>
