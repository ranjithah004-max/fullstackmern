<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPLE FORM</title>
</head>
<body>
    <h2>Student form</h2>
    <form>
        <label>Name:</label>
        <input type="text">
        <br><br>

        <label>Email</label>
        <input 
            type="text"
            placeholder="Enter your email">
        <br><br>
        <label>Password:</label>

       <input
         type="password"
         placeholder="Enter password">
         <br><br>

        <button>Submit</button>
        <br><br>
        
 
<label>Gender:</label>

<br>

<input type="radio" name="gender" value="male">
<label>Male</label>

<input type="radio" name="gender" value="female">
<label>Female</label>

<br><br>
<label>Skills:</label>

<br>

<input type="checkbox" name="skill" value="java">
<label>Java</label><br>

<input type="checkbox" name="skill" value="html">
<label>HTML</label><br>

<input type="checkbox" name="skill" value="css">
<label>CSS</label>
<br>

<label>Course:</label>

<select>

    <option>Java</option>
    <option>Python</option>
    <option>JavaScript</option>
    <option>C++</option>

</select>
<br>

<!-- Address -->
        <label for="address">Address:</label>

        <br>

        <textarea
            id="address"
            name="address"
            rows="5"
            cols="40"
            placeholder="Enter your address">
        </textarea>

        <br><br>


        <!-- Buttons -->
        <button type="submit">
            Register
        </button>

        <button type="reset">
            Reset
        </button>
    </form>
</body>
</html>
