<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .fix{
            position:fixed;
            left:50%;
            top:50%;

        }
        .box2{
            height:200px;
        }
        .box1{
            height:200px;
        }
        .box{
            position:relative;
            top:20px;
            left:20px;
        }
        .parent{
            position:relative;
            height:300px;
            width:300px;
        }
        .child{
            position:absolute;
            right:10px;
        }
        .sticky{
            position:sticky;
            top=0px;
        }
    </style>
</head>
<body>
    <div class="fix">FIXED POSITION</div>
    <div class="parent">
        <div class="child">Hello</div>
    </div>
    <h1 class="box">box</h1>
    <h1 class="sticky">STICKY ELEMENT</h1>
    <h1 class="box1">box1</h1>
    <h1 class="box2">box2</h1>
</body>
</html>
